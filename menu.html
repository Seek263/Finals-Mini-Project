<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Coffee and snacks at Campus Cafe.">
  <title>Menu | Campus Cafe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="brand">Campus Cafe <span>Ride &amp; Brew</span></p>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html" class="current" aria-current="page">Menu</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Menu</h1>
    <p class="intro">Freshly brewed drinks for riders and students on the go.</p>
    <section class="items">
      <article class="item">
        <img src="espresso.jpg" alt="A shot of espresso in a clear glass cup on a white saucer with a black spoon">
        <div>
          <h2>Throttle Espresso</h2>
          <p>Classic</p>
          <p class="price">PHP 100</p>
        </div>
      </article>
      <article class="item">
        <img src="latte.jpg" alt="A layered cafe latte with milk foam in a tall glass mug on a wooden table">
        <div>
          <h2>Cafe Latte</h2>
          <p>Creamy</p>
          <p class="price">PHP 180</p>
        </div>
      </article>
      <article class="item">
        <img src="americano.jpg" alt="Two glasses of iced americano with coffee beans scattered on the table">
        <div>
          <h2>Iced Americano</h2>
          <p>Energy</p>
          <p class="price">PHP 120</p>
        </div>
      </article>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Campus Cafe &middot; Group 05 &middot; School project</p>
  </footer>
</body>
</html>
