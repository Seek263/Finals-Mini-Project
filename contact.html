  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Campus Cafe.">
    <title>Contact | Campus Cafe</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <p class="brand">Campus Cafe <span>Ride &amp; Brew</span></p>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html" class="current" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Contact</h1>
      <p class="intro">Questions, orders, or ride meetups? Send us a note.</p>
      <form action="https://formsubmit.co/nrgshanks0@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="New message from the Campus Cafe website">
        <input type="hidden" name="_template" value="table">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required autocomplete="off">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="off">
        </div>
        <div class="field"> 
          <label for="topic">Topic</label>
          <select id="topic" name="topic">
            <option value="order">Order inquiry</option>
            <option value="event">Rider meetup</option>
            <option value="feedback">Feedback</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6"></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </main>
    <footer>
      <p>&copy; 2026 Campus Cafe &middot; Group 05 &middot; School project</p>
    </footer>
  </body>
  </html>
